# OpenOCD config for Xilinx Virtex UltraScale+ HBM XCVU33P via FT2232H (channel A).
#
# Uses the virtex2 pld driver (CFG_IN/JSTART are the same on UltraScale+) for "pld load 0 <bit>".
# Syntax compatible with OpenOCD 0.11 and 0.12 (0.12 warns about the ftdi_* commands).

adapter driver ftdi
adapter speed 5000
transport select jtag
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb
reset_config none

# XCVU33P: irlen 6, USER1=0x02, USER2=0x03.
set _CHIPNAME xcvu33p
jtag newtap $_CHIPNAME tap -irlen 6 -ignore-version -expected-id 0x04b69093

pld device virtex2 $_CHIPNAME.tap 1
