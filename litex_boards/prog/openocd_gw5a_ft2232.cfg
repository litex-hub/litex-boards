# OpenOCD config for Gowin GW5AST-138 boards via FT2232 compatible debuggers (channel A), e.g. the
# Sipeed USB debugger of the Tang Mega 138K Pro. The FTDI commands use the forms accepted by both
# OpenOCD 0.11 and 0.12.

adapter driver ftdi
adapter speed 1000
transport select jtag
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x0008 0x000b
reset_config none

set _CHIPNAME gw5a
jtag newtap $_CHIPNAME tap -irlen 8 -expected-id 0x0001081b
